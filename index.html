<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Clone</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <main>
        <section>
            <div class="all-reels">
                <div class="icons">
                        <div class="like">
                        <i class="ri-heart-3-line"></i>
                        <h4>4.8k</h4>    
                        </div>
                        <div class="comment">
                           <i class="ri-chat-3-fill"></i>
                        <h4>4.8k</h4>
                        </div>
                        
                        <div class="share">
                      <i class="ri-share-forward-line"></i>
                        <h4>4.8k</h4>
                        </div>
                        <i class="ri-more-2-fill"></i>
                    </div>                        
                <div class="reel">
                    <img src="https://i.pinimg.com/736x/6b/f5/6d/6bf56d6995a1ffdf404e2c1a1215826d.jpg" alt="">
                    
                    <!-- <video muted autoplay loop src=""></video> -->
                    <div class="bottom">
                        <div class="info">
                            <img class="profile-pic" src="https://i.pinimg.com/736x/86/c8/a1/86c8a135f33910c9dc0687791e5445bc.jpg" alt="">
                            <h4>Dhruv Narayan</h4>
                            <button class="follow">Follow</button>
                    </div>
                        <h3>description</h3>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
